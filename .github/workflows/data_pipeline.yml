name: Automazione Rivalry Index

on:
  # Permette di lanciare il processo manualmente dalla pagina GitHub
  workflow_dispatch:
  # (Opzionale) Decommenta la riga sotto se vuoi che si avvii da solo ogni volta che modifichi il codice
  # push:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v3

      - name: Configura Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installa le librerie
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests beautifulsoup4 cloudscraper SPARQLWrapper Pillow

      - name: Fase 1 - Estrazione Dati (ETL)
        run: python open_data_etl.py

      - name: Fase 2 - Ricerca Trofei (Scraping)
        run: python trophy_scraper.py

      - name: Fase 3 - Calcolo Rivalità
        run: python rivalry_model.py

      - name: Fase 4 - Download Loghi Originali
        run: python asset_exporter.py

      - name: Fase 5 - Pulizia Grafica Loghi
        run: python logo_normalizer.py

      - name: Carica Risultati come ZIP
        uses: actions/upload-artifact@v3
        with:
          name: Rivalry-Data-and-Logos
          # Salva i CSV e l'intera cartella grafica in uno zip scaricabile
          path: |
            *.csv
            assets/
